name: release

# 推送 v* 标签时自动构建并发布 GitHub Release。
# 资产命名必须与 App 内置更新器一致：
#   ykt-<goos>-<goarch>.zip / ykt-linux-amd64.tar.gz + checksums.txt
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build macOS App (arm64 + amd64)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in arm64 amd64; do
            "$HOME/go/bin/wails" build -platform "darwin/$ARCH" -ldflags "-X main.appVersion=$VERSION"
            mkdir -p "staging-$ARCH"
            cp -R build/bin/ykt.app "staging-$ARCH/雨课助手.app"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "staging-$ARCH/雨课助手.app" "ykt-darwin-$ARCH.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ykt-darwin-*.zip

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build CLI assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          build() {
            local goos="$1" goarch="$2" out="$3"
            mkdir -p "stage-$goos-$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -tags cli -trimpath -ldflags "-s -w -X main.appVersion=$VERSION" -o "stage-$goos-$goarch/$out" .
          }
          build linux amd64 ykt
          tar -czf ykt-linux-amd64.tar.gz -C stage-linux-amd64 ykt
          build windows amd64 ykt.exe
          (cd stage-windows-amd64 && zip -q ../ykt-windows-amd64.zip ykt.exe)
          build darwin arm64 ykt
          (cd stage-darwin-arm64 && zip -q ../ykt-darwin-arm64-cli.zip ykt)
          build darwin amd64 ykt
          (cd stage-darwin-amd64 && zip -q ../ykt-darwin-amd64-cli.zip ykt)
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            ykt-linux-amd64.tar.gz
            ykt-windows-amd64.zip
            ykt-darwin-*-cli.zip

  release:
    needs: [macos, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets & checksums
        run: |
          mkdir -p upload
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          cd upload
          sha256sum ykt-* > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
